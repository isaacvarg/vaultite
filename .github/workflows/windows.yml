name: Windows
on:
  workflow_dispatch:
jobs:
  arm64:
    strategy:
      fail-fast: false
      matrix:
        order: ["default,default,default", "nosandbox,nosandbox,default", "edge,edge,default,chrome"]
    runs-on: windows-11-arm
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - run: npx -y playwright-core@1.63.0 install chromium
      - run: ORDER=${{ matrix.order }} node tools/diag_opt2.ts
